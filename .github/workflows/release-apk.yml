name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify scheduler and player tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/mytvb-release.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASE_KEYSTORE_B64"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RELEASE_STORE_FILE"
          bash ./gradlew :app:assembleRelease --no-daemon
      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} artifacts/MyTVB-Speed-Boost-${GITHUB_REF_NAME}.apk \;
      - uses: actions/upload-artifact@v4
        with:
          name: MyTVB-Speed-Boost-${{ github.ref_name }}
          path: artifacts/*.apk
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          body_path: RELEASE_NOTES.md
          prerelease: false
          draft: false
          make_latest: true
